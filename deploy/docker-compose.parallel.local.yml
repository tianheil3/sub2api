# =============================================================================
# Sub2API Docker Compose - Parallel Local Environment
# =============================================================================
# This stack is intended to run alongside an existing deployment without
# sharing ports, containers, networks, databases, Redis, or local data dirs.
#
# Quick Start:
#   1. cp .env.parallel.example .env.parallel
#   2. mkdir -p data_parallel postgres_data_parallel redis_data_parallel
#   3. docker compose --env-file .env.parallel -f docker-compose.parallel.local.yml up -d
#   4. docker compose --env-file .env.parallel -f docker-compose.parallel.local.yml logs -f sub2api
#   5. Access: http://localhost:${PARALLEL_SERVER_PORT:-18080}
# =============================================================================

name: sub2api-parallel

services:
  sub2api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sub2api-parallel:local
    container_name: sub2api-parallel
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${PARALLEL_BIND_HOST:-127.0.0.1}:${PARALLEL_SERVER_PORT:-18080}:8080"
    volumes:
      - ./data_parallel:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${PARALLEL_SERVER_MODE:-release}
      - RUN_MODE=${PARALLEL_RUN_MODE:-standard}

      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${PARALLEL_POSTGRES_USER:-sub2api_parallel}
      - DATABASE_PASSWORD=${PARALLEL_POSTGRES_PASSWORD:?PARALLEL_POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${PARALLEL_POSTGRES_DB:-sub2api_parallel}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${PARALLEL_DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${PARALLEL_DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${PARALLEL_DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${PARALLEL_DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${PARALLEL_REDIS_PASSWORD:-}
      - REDIS_DB=${PARALLEL_REDIS_DB:-0}
      - REDIS_POOL_SIZE=${PARALLEL_REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${PARALLEL_REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${PARALLEL_REDIS_ENABLE_TLS:-false}

      - ADMIN_EMAIL=${PARALLEL_ADMIN_EMAIL:-admin-parallel@sub2api.local}
      - ADMIN_PASSWORD=${PARALLEL_ADMIN_PASSWORD:-}
      - JWT_SECRET=${PARALLEL_JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${PARALLEL_JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${PARALLEL_TOTP_ENCRYPTION_KEY:-}
      - TZ=${PARALLEL_TZ:-Asia/Shanghai}

      - GEMINI_OAUTH_CLIENT_ID=${PARALLEL_GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${PARALLEL_GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${PARALLEL_GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${PARALLEL_GEMINI_QUOTA_POLICY:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${PARALLEL_GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${PARALLEL_ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}

      - SECURITY_URL_ALLOWLIST_ENABLED=${PARALLEL_SECURITY_URL_ALLOWLIST_ENABLED:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${PARALLEL_SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${PARALLEL_SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${PARALLEL_SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}

      - UPDATE_PROXY_URL=${PARALLEL_UPDATE_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-parallel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres-parallel
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${PARALLEL_BIND_HOST:-127.0.0.1}:${PARALLEL_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./postgres_data_parallel:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${PARALLEL_POSTGRES_USER:-sub2api_parallel}
      - POSTGRES_PASSWORD=${PARALLEL_POSTGRES_PASSWORD:?PARALLEL_POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${PARALLEL_POSTGRES_DB:-sub2api_parallel}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${PARALLEL_TZ:-Asia/Shanghai}
    networks:
      - sub2api-parallel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARALLEL_POSTGRES_USER:-sub2api_parallel} -d ${PARALLEL_POSTGRES_DB:-sub2api_parallel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis-parallel
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${PARALLEL_BIND_HOST:-127.0.0.1}:${PARALLEL_REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - ./redis_data_parallel:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${PARALLEL_REDIS_PASSWORD:+--requirepass "$PARALLEL_REDIS_PASSWORD"}'
    environment:
      - TZ=${PARALLEL_TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${PARALLEL_REDIS_PASSWORD:-}
    networks:
      - sub2api-parallel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-parallel-network:
    driver: bridge
